<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>La Colonie</title>
    <meta name="description" content="Creuse ta fourmilière, élève tes fourmis, pars en expédition et tisse des symbioses — la colonie vit même quand tu es parti." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐜</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/games/la-colonie/colonie.css" />
  </head>
  <body>
    <canvas id="colonie"></canvas>

    <a class="back-link" href="../../">← le petit prince</a>

    <div class="hud-top">
      <div id="hud-res"></div>
      <div id="hud-pop" class="pill"></div>
    </div>

    <div class="bandeau" id="bandeau">
      <span></span>
      <button type="button" data-action="annuler-mode">✕ annuler</button>
    </div>

    <div class="popup" id="popup"></div>

    <div class="panel" id="panel">
      <div class="panel-head">
        <span id="panel-title"></span>
        <button type="button" data-action="fermer">✕</button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </div>

    <nav class="barre">
      <button type="button" data-ouvre="construire">🏗️<small>construire</small></button>
      <button type="button" data-ouvre="nurserie">🥚<small>nurserie</small></button>
      <button type="button" data-ouvre="expeditions">🗺️<small>expéditions</small></button>
      <button type="button" data-ouvre="cercles">🕸️<small>cercles</small></button>
      <button type="button" data-ouvre="rapports">📜<small>rapports</small><span class="badge" id="badge-rapports"></span></button>
    </nav>

    <div class="hint" id="hint">
      <img class="hint-img" src="../../colonie/reine.jpg?v=2" alt="" />
      <h1>La Colonie</h1>
      <p>Creuse des galeries, construis des salles, élève ouvrières et soldates.<br />
      Pars en expédition pour rallier d'autres insectes à ta cause.<br />
      La colonie travaille même quand tu es parti. 🐜</p>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="/src/games/la-colonie/main.ts"></script>
  </body>
</html>
