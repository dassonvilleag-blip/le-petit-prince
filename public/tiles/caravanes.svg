<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140">
  <!-- carte en parchemin -->
  <rect width="200" height="140" fill="#f3e3c3"/>
  <path d="M0 0 H14 Q8 18 12 34 Q18 52 10 70 Q4 88 12 106 Q16 124 10 140 H0 Z" fill="#8fc1cf"/>
  <ellipse cx="168" cy="96" rx="44" ry="34" fill="#ecd08f" opacity="0.6"/>
  <!-- routes -->
  <path d="M34 86 L64 50 L96 104 L128 44 L164 98" fill="none" stroke="#b33a2e" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
  <!-- villes -->
  <g fill="#fff7e4" stroke="#3b2a1a" stroke-width="2.5">
    <circle cx="34" cy="86" r="9"/><circle cx="64" cy="50" r="9"/><circle cx="96" cy="104" r="9"/><circle cx="128" cy="44" r="9"/><circle cx="164" cy="98" r="9"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="34" y="90">⚓</text><text x="64" y="54">🏺</text><text x="96" y="108">🐑</text><text x="128" y="48">🍇</text><text x="164" y="102">💎</text>
  </g>
  <!-- la caravane en route -->
  <text x="112" y="80" font-size="30" text-anchor="middle">🐪</text>
  <!-- une charrette bien rangée -->
  <g transform="translate(150 12)">
    <rect width="40" height="30" rx="4" fill="#8a5a32" stroke="#5a3a1e" stroke-width="2"/>
    <rect x="3" y="3" width="16" height="11" rx="2" fill="#d0784a"/>
    <rect x="21" y="3" width="16" height="11" rx="2" fill="#9cc3d8"/>
    <rect x="3" y="16" width="24" height="11" rx="2" fill="#e6c35c"/>
    <rect x="29" y="16" width="8" height="11" rx="2" fill="#a8324a"/>
  </g>
</svg>
