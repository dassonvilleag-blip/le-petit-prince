<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- tuile de l'atelier : nuit étoilée, deux dés dont l'étoile-joker -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#1b2455"/>
      <stop offset="100%" stop-color="#0c1233"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#e3dbc6"/>
    </linearGradient>
    <linearGradient id="goldy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#e0a92f"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="30" cy="28" r="1.6" opacity=".9"/>
    <circle cx="86" cy="14" r="1.1" opacity=".7"/>
    <circle cx="140" cy="34" r="1.4" opacity=".8"/>
    <circle cx="210" cy="18" r="1.2" opacity=".7"/>
    <circle cx="268" cy="40" r="1.7" opacity=".9"/>
    <circle cx="300" cy="90" r="1.2" opacity=".6"/>
    <circle cx="24" cy="120" r="1.3" opacity=".6"/>
    <circle cx="60" cy="170" r="1.2" opacity=".7"/>
    <circle cx="292" cy="164" r="1.4" opacity=".8"/>
    <circle cx="176" cy="8" r="1" opacity=".6"/>
  </g>
  <!-- dé ivoire (le 5) -->
  <g transform="rotate(-12 120 118)">
    <rect x="76" y="74" width="88" height="88" rx="16" fill="url(#ivory)"/>
    <g fill="#2a2438">
      <circle cx="98" cy="96" r="7"/>
      <circle cx="142" cy="96" r="7"/>
      <circle cx="120" cy="118" r="7"/>
      <circle cx="98" cy="140" r="7"/>
      <circle cx="142" cy="140" r="7"/>
    </g>
  </g>
  <!-- dé étoile (le joker) -->
  <g transform="rotate(9 216 130)">
    <rect x="172" y="86" width="88" height="88" rx="16" fill="url(#goldy)"/>
    <path fill="#8a5b00" d="M216 102l7.6 16.4 18 2.2-13.3 12.3 3.5 17.8L216 142l-15.8 8.7 3.5-17.8-13.3-12.3 18-2.2z"/>
  </g>
</svg>
