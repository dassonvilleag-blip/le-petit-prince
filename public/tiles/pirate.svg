<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#1a0838"/>
      <stop offset="100%" stop-color="#06030e"/>
    </radialGradient>
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f8e060" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#06030e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#bg)"/>

  <!-- Moon glow -->
  <circle cx="150" cy="100" r="90" fill="url(#moon-glow)"/>

  <!-- Stars -->
  <circle cx="30" cy="25" r="1.5" fill="#fff" opacity=".8"/>
  <circle cx="75" cy="12" r="1" fill="#fff" opacity=".7"/>
  <circle cx="120" cy="30" r="1.5" fill="#fff" opacity=".9"/>
  <circle cx="185" cy="18" r="1" fill="#fff" opacity=".6"/>
  <circle cx="240" cy="28" r="1.5" fill="#fff" opacity=".8"/>
  <circle cx="272" cy="10" r="1" fill="#fff" opacity=".7"/>
  <circle cx="55" cy="55" r="1" fill="#fff" opacity=".5"/>
  <circle cx="260" cy="60" r="1" fill="#fff" opacity=".5"/>

  <!-- Moon -->
  <circle cx="150" cy="98" r="35" fill="#f8e880"/>
  <circle cx="162" cy="90" r="32" fill="#06030e"/>

  <!-- Skull -->
  <ellipse cx="150" cy="168" rx="36" ry="34" fill="#e8e0d0"/>
  <!-- Eye sockets -->
  <ellipse cx="138" cy="163" rx="9" ry="10" fill="#1a0838"/>
  <ellipse cx="162" cy="163" rx="9" ry="10" fill="#1a0838"/>
  <!-- Nose -->
  <polygon points="150,170 146,180 154,180" fill="#1a0838"/>
  <!-- Teeth -->
  <rect x="136" y="185" width="8" height="8" fill="#1a0838" rx="1"/>
  <rect x="146" y="185" width="8" height="8" fill="#1a0838" rx="1"/>
  <rect x="156" y="185" width="8" height="8" fill="#1a0838" rx="1"/>

  <!-- Crossed bones -->
  <rect x="82" y="205" width="136" height="14" fill="#d4ccbc" rx="7" transform="rotate(-30 150 212)"/>
  <rect x="82" y="205" width="136" height="14" fill="#c8c0b0" rx="7" transform="rotate(30 150 212)"/>
  <!-- Bone ends -->
  <circle cx="98" cy="195" r="10" fill="#d4ccbc"/>
  <circle cx="90" cy="203" r="9" fill="#d4ccbc"/>
  <circle cx="202" cy="195" r="10" fill="#d4ccbc"/>
  <circle cx="210" cy="203" r="9" fill="#d4ccbc"/>
  <circle cx="98" cy="230" r="10" fill="#c8c0b0"/>
  <circle cx="90" cy="222" r="9" fill="#c8c0b0"/>
  <circle cx="202" cy="230" r="10" fill="#c8c0b0"/>
  <circle cx="210" cy="222" r="9" fill="#c8c0b0"/>

  <!-- Straw hat brim -->
  <ellipse cx="150" cy="137" rx="52" ry="14" fill="#c89830"/>
  <!-- Straw hat dome -->
  <ellipse cx="150" cy="128" rx="34" ry="26" fill="#e0aa40"/>
  <!-- Hat highlight -->
  <ellipse cx="140" cy="120" rx="14" ry="10" fill="#f0c050" opacity=".35"/>
  <!-- Hat band -->
  <rect x="116" y="132" width="68" height="8" fill="#c02828"/>
</svg>
