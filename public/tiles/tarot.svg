    <text x="186" y="108" font-family="Georgia, serif" font-weight="800" font-size="34" fill="#c8322b" text-anchor="middle">R</text>
    <text x="186" y="132" font-family="Georgia, serif" font-size="20" fill="#c8322b" text-anchor="middle">♥</text>
    <text x="156" y="64" font-family="Georgia, serif" font-weight="800" font-size="14" fill="#c8322b">R</text>
