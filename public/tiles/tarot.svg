    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#tapis)"/>
  <rect x="6" y="6" width="308" height="188" rx="22" fill="none" stroke="#5a3720" stroke-width="8"/>
  <g transform="rotate(-16 160 190)">
    <rect x="96" y="44" width="76" height="116" rx="8" fill="url(#ivoire)" stroke="#2b4a8b" stroke-opacity=".5" stroke-width="2"/>
