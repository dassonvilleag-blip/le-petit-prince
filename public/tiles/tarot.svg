    <text x="134" y="114" font-family="Georgia, serif" font-weight="800" font-size="34" fill="#2b4a8b" text-anchor="middle">21</text>
    <text x="104" y="64" font-family="Georgia, serif" font-weight="800" font-size="14" fill="#2b4a8b">21</text>
